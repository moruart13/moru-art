<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Moru Art" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#shine)"/>

  <!-- M strokes: left leg, peak, valley, peak, right leg down to the pencil -->
  <path d="M33 80 V36 L60 62 L87 36 V58"
        fill="none" stroke="#f5f3ff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pencil tip forming the end of the right leg -->
  <path d="M81.5 58 H92.5 L87 82 Z" fill="#ddd6fe"/>
  <path d="M84.6 74 H89.4 L87 82 Z" fill="#2e1065"/>

  <!-- line drawn by the pencil -->
  <path d="M87 82.5 C76 92 58 88 40 92 C34 93.5 29 93 24 91"
        fill="none" stroke="url(#line)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
